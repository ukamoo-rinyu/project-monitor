<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公共施設プロジェクト情報ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:    #0F1923;
    --paper:  #F2F0EB;
    --warm:   #E8E4DC;
    --accent: #2563A8;
    --sand:   #C8B89A;
    --muted:  #6B7280;
    --border: #D5D0C8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

  /* ヘッダー */
  header {
    background: var(--ink); color: var(--paper);
    padding: 0 32px; display: flex; align-items: center;
    justify-content: space-between; height: 64px;
    position: sticky; top: 0; z-index: 100;
    border-bottom: 3px solid var(--accent);
  }
  .header-left { display: flex; align-items: baseline; gap: 16px; }
  .site-title { font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; }
  .site-subtitle { font-size: 11px; color: var(--sand); letter-spacing: 0.12em; }
  .header-meta { font-size: 11px; color: var(--sand); text-align: right; line-height: 1.8; }
  .update-dot {
    display: inline-block; width: 6px; height: 6px;
    background: #4ADE80; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* レイアウト */
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 64px); }

  /* サイドバー */
  aside {
    background: var(--warm); border-right: 1px solid var(--border);
    padding: 24px 20px; position: sticky; top: 64px;
    height: calc(100vh - 64px); overflow-y: auto;
  }
  .aside-section { margin-bottom: 28px; }
  .aside-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  /* キーワードボタン */
  .keyword-list { display: flex; flex-direction: column; gap: 3px; }
  .keyword-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; border-radius: 4px; border: none;
    background: transparent; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--ink);
    transition: background 0.15s; text-align: left; gap: 6px;
  }
  .keyword-btn:hover { background: var(--border); }
  .keyword-btn.active { background: var(--accent); color: white; font-weight: 500; }
  .keyword-btn .kw-left { display: flex; align-items: center; gap: 7px; }
  .keyword-btn .count { font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; margin-left: auto; }
  .kw-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ソースボタン */
  .source-list { display: flex; flex-direction: column; gap: 3px; }
  .source-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 4px; border: none;
    background: transparent; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--ink);
    transition: background 0.15s;
  }
  .source-btn:hover { background: var(--border); }
  .source-btn.active { background: var(--accent); color: white; }
  .source-icon {
    width: 18px; height: 18px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; flex-shrink: 0;
  }
  .icon-news { background: #FEF3C7; color: #92400E; }
  .icon-gov  { background: #DBEAFE; color: #1E40AF; }

  /* メイン */
  main { padding: 28px 36px; max-width: 900px; }

  /* ツールバー */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px; }
  .results-info { font-size: 13px; color: var(--muted); }
  .results-info strong { color: var(--ink); font-weight: 700; }
  .toolbar-right { display: flex; align-items: center; gap: 12px; }
  .search-box {
    display: flex; align-items: center;
    background: white; border: 1px solid var(--border);
    border-radius: 4px; padding: 0 12px; gap: 8px;
  }
  .search-box input {
    border: none; outline: none;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px;
    color: var(--ink); background: transparent; padding: 8px 0; width: 180px;
  }
  .sort-select {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 12px; font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px; color: var(--ink); background: white; cursor: pointer; outline: none;
  }

  /* アクティブフィルタータグ */
  .active-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; min-height: 0; }
  .filter-tag {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent); color: white;
    font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500;
  }
  .filter-tag .remove { cursor: pointer; opacity: 0.7; font-size: 14px; line-height: 1; }
  .filter-tag .remove:hover { opacity: 1; }

  /* 記事カード */
  .article-list { display: flex; flex-direction: column; }
  .article-card {
    display: grid; grid-template-columns: 4px 1fr;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s; cursor: pointer;
  }
  .article-card:first-of-type { border-top: 1px solid var(--border); }
  .article-card:hover { background: white; }
  .card-accent-bar { background: var(--border); transition: background 0.12s; }
  .article-card:hover .card-accent-bar { background: var(--accent); }
  .card-body { padding: 16px 20px; }

  .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .source-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 2px; }
  .badge-news { background: #FEF3C7; color: #92400E; }
  .badge-gov  { background: #DBEAFE; color: #1E40AF; }
  .card-date  { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card-title {
    font-family: 'Noto Serif JP', serif; font-size: 15px; font-weight: 700;
    line-height: 1.55; color: var(--ink); margin-bottom: 6px;
    text-decoration: none; display: block;
  }
  .card-title:hover { color: var(--accent); }

  .card-summary {
    font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* カテゴリーバッジ（記事内キーワード） */
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .kw-badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px;
    letter-spacing: 0.04em; white-space: nowrap;
    cursor: pointer; transition: opacity 0.12s;
  }
  .kw-badge:hover { opacity: 0.75; }

  /* 日付グループ */
  .date-group-header {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--muted); padding: 18px 0 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ローディング */
  .loading-state { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ページネーション */
  .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 32px; padding-bottom: 48px; }
  .page-btn {
    min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 4px; background: white;
    font-size: 13px; color: var(--ink); cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; transition: all 0.12s; padding: 0 10px;
  }
  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: 700; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 20px 16px; }
    .toolbar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="site-title">公共施設プロジェクト情報</span>
    <span class="site-subtitle">INFRASTRUCTURE PROJECT MONITOR</span>
  </div>
  <div class="header-meta">
    <span class="update-dot"></span>自動更新中<br>
    最終取得：<span id="last-updated">2025年6月20日 08:00</span>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="aside-section">
      <div class="aside-label">キーワード</div>
      <div class="keyword-list" id="keyword-list"></div>
    </div>
    <div class="aside-section">
      <div class="aside-label">情報ソース</div>
      <div class="source-list" id="source-list">
        <button class="source-btn active" data-source="all">
          <span class="source-icon" style="background:#E5E7EB;color:#374151;font-size:9px;">ALL</span>すべて
        </button>
        <button class="source-btn" data-source="news">
          <span class="source-icon icon-news">記</span>ニュース・記事
        </button>
        <button class="source-btn" data-source="gov">
          <span class="source-icon icon-gov">官</span>官公庁・自治体
        </button>
      </div>
    </div>
    <div class="aside-section">
      <div class="aside-label">期間</div>
      <div class="keyword-list">
        <button class="keyword-btn active" data-period="all"><span class="kw-left">すべて</span></button>
        <button class="keyword-btn" data-period="1"><span class="kw-left">今日</span></button>
        <button class="keyword-btn" data-period="7"><span class="kw-left">直近1週間</span></button>
        <button class="keyword-btn" data-period="30"><span class="kw-left">直近1ヶ月</span></button>
      </div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="results-info"><strong id="result-count">0</strong> 件の情報</div>
      <div class="toolbar-right">
        <div class="search-box">
          <span style="color:var(--muted)">🔍</span>
          <input type="text" id="search-input" placeholder="タイトルを検索…">
        </div>
        <select class="sort-select" id="sort-select">
          <option value="date-desc">新しい順</option>
          <option value="date-asc">古い順</option>
        </select>
      </div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="article-list" id="article-list">
      <div class="loading-state"><div class="spinner"></div>読み込み中…</div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script>
// ── キーワードと色定義 ──
const KW_CONFIG = [
  { kw: "施設",         bg: "#E0F2FE", color: "#0369A1" },
  { kw: "再編",         bg: "#FCE7F3", color: "#9D174D" },
  { kw: "複合",         bg: "#D1FAE5", color: "#065F46" },
  { kw: "建築プロジェクト", bg: "#EDE9FE", color: "#5B21B6" },
  { kw: "集約",         bg: "#FEF9C3", color: "#854D0E" },
  { kw: "多機能",       bg: "#FFEDD5", color: "#9A3412" },
  { kw: "整備",         bg: "#F0FDF4", color: "#166534" },
  { kw: "コスト",       bg: "#FEE2E2", color: "#991B1B" },
  { kw: "建設",         bg: "#E0E7FF", color: "#3730A3" },
  { kw: "PFI",          bg: "#F5F3FF", color: "#6D28D9" },
];

const KW_MAP = {};
KW_CONFIG.forEach(c => { KW_MAP[c.kw] = c; });
const KEYWORDS = KW_CONFIG.map(c => c.kw);

// ── サンプルデータ ──
const SAMPLE_DATA = [
  {
    id: 1,
    title: "市立図書館と子育て支援センターの複合施設整備計画を発表　○○市",

    url: "#", source: "news", sourceName: "建設通信新聞", date: "2025-06-20",
    keywords: ["複合", "整備", "施設", "建設", "コスト"]
  },
  {
    id: 2,
    title: "公共施設再編計画の見直しについて（パブリックコメント実施）",
    summary: "令和7年度から令和16年度を計画期間とする公共施設再編計画の見直し案を策定しました。市民の皆様からのご意見を募集しています。",
    url: "#", source: "gov", sourceName: "○○県", date: "2025-06-20",
    keywords: ["再編", "施設"]
  },
  {
    id: 3,
    title: "スポーツ施設と防災拠点を集約した多機能複合施設の設計競技　結果発表",
    summary: "国土交通省が推進する「公共施設多機能化モデル事業」において、○○地区の集約施設設計競技の最優秀作品が決定した。",
    url: "#", source: "news", sourceName: "日刊建設工業新聞", date: "2025-06-19",
    keywords: ["集約", "多機能", "複合", "施設", "建設"]
  },
  {
    id: 4,
    title: "公民館・保健センター・図書館の集約整備に向けた基本計画策定業務委託",
    summary: "3施設の集約整備に関する基本計画策定業務を委託します。地域住民ニーズの把握から施設規模の検討まで一括して実施。",
    url: "#", source: "gov", sourceName: "○○市", date: "2025-06-19",
    keywords: ["集約", "整備", "施設"]
  },
  {
    id: 5,
    title: "廃校活用で地域の多機能施設へ　文科省が先進事例10件を公表",
    summary: "文部科学省は廃校を地域の多機能拠点として活用した先進的取組10件を公表。福祉・教育・防災機能を一体的に整備した事例が多数含まれる。",
    url: "#", source: "news", sourceName: "Yahoo!ニュース", date: "2025-06-18",
    keywords: ["多機能", "整備", "施設"]
  },
  {
    id: 6,
    title: "令和7年度 公共施設マネジメント推進事業 採択結果",
    summary: "国土交通省は令和7年度の公共施設マネジメント推進事業の採択自治体を発表した。全国43自治体が選定され、施設再編や複合化を進める。",
    url: "#", source: "gov", sourceName: "国土交通省", date: "2025-06-18",
    keywords: ["再編", "複合", "施設"]
  },
  {
    id: 7,
    title: "築50年超の市庁舎建替え　建築プロジェクト始動　PFI方式で民間活力活用へ",
    summary: "○○市は老朽化が著しい市庁舎の建替え建築プロジェクトを正式にスタートした。PFI方式での整備を検討しており、今年度内に民間事業者への要求水準書を公表予定。コスト縮減効果を試算中。",
    url: "#", source: "news", sourceName: "地方行政", date: "2025-06-17",
    keywords: ["建築プロジェクト", "整備", "PFI", "コスト", "建設"]
  },
  {
    id: 8,
    title: "医療・福祉・商業が一体となった複合施設の開発計画　都市再開発法に基づく認可",
    summary: "○○都市計画区域内で、医療施設・福祉施設・商業施設を複合的に整備する再開発計画が都市再開発法に基づき認可された。",
    url: "#", source: "gov", sourceName: "○○都", date: "2025-06-17",
    keywords: ["複合", "施設", "整備"]
  },
  {
    id: 9,
    title: "PFI手法による公共施設整備の課題と効果　国交省が調査報告書を公表",
    summary: "国土交通省はPFI手法を活用した公共施設整備事業について調査した報告書を公表。コスト削減効果は平均12%、建設期間短縮にも効果があることが示された。",
    url: "#", source: "gov", sourceName: "国土交通省", date: "2025-06-16",
    keywords: ["PFI", "施設", "整備", "コスト", "建設"]
  },
  {
    id: 10,
    title: "公共建設工事の資材コスト高騰が地方自治体の整備計画に影響",
    summary: "建設資材価格の高騰が続く中、多くの地方自治体が公共施設の整備計画の見直しを余儀なくされている。コスト縮減策としてPFIや複合化の検討が加速している。",
    url: "#", source: "news", sourceName: "建設工業新聞", date: "2025-06-16",
    keywords: ["建設", "コスト", "整備", "PFI", "複合", "施設"]
  },
];

// ── 状態 ──
let state = {
  articles: SAMPLE_DATA,
  activeKeywords: [],
  activeSource: "all",
  activePeriod: "all",
  searchQuery: "",
  sort: "date-desc",
  page: 1,
  perPage: 10,
};

// ── バッジHTML生成 ──
function kwBadge(kw, clickable = true) {
  const c = KW_MAP[kw];
  if (!c) return `<span class="kw-badge" style="background:#EAE6DF;color:var(--muted)">${kw}</span>`;
  const click = clickable ? `onclick="filterByKw('${kw}')"` : '';
  return `<span class="kw-badge" style="background:${c.bg};color:${c.color}" ${click} title="${kw}で絞り込む">${kw}</span>`;
}

function filterByKw(kw) {
  if (!state.activeKeywords.includes(kw)) {
    state.activeKeywords.push(kw);
    state.page = 1;
    render();
  }
}

// ── キーワードサイドバー ──
function renderKeywords() {
  const el = document.getElementById('keyword-list');
  const allActive = state.activeKeywords.length === 0;
  let html = `<button class="keyword-btn ${allActive ? 'active' : ''}" data-kw="ALL">
    <span class="kw-left">すべて</span>
    <span class="count">${SAMPLE_DATA.length}</span>
  </button>`;
  KEYWORDS.forEach(kw => {
    const c = KW_MAP[kw];
    const cnt = SAMPLE_DATA.filter(a => a.keywords.includes(kw)).length;
    const active = state.activeKeywords.includes(kw);
    const dotColor = active ? 'white' : c.color;
    const dotBg   = active ? 'rgba(255,255,255,0.5)' : c.bg;
    html += `<button class="keyword-btn ${active ? 'active' : ''}" data-kw="${kw}">
      <span class="kw-left">
        <span class="kw-dot" style="background:${dotBg};border:2px solid ${dotColor}"></span>
        ${kw}
      </span>
      <span class="count">${cnt}</span>
    </button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.keyword-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const kw = btn.dataset.kw;
      if (kw === 'ALL') { state.activeKeywords = []; }
      else {
        state.activeKeywords = state.activeKeywords.includes(kw)
          ? state.activeKeywords.filter(k => k !== kw)
          : [...state.activeKeywords, kw];
      }
      state.page = 1; render();
    });
  });
}

// ── ソース・期間 ──
function bindSourceButtons() {
  document.getElementById('source-list').querySelectorAll('.source-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeSource = btn.dataset.source; state.page = 1;
      document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); render();
    });
  });
  document.querySelectorAll('[data-period]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activePeriod = btn.dataset.period; state.page = 1;
      document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); render();
    });
  });
}

// ── フィルタリング ──
function filteredArticles() {
  let list = [...state.articles];
  if (state.activeKeywords.length > 0)
    list = list.filter(a => state.activeKeywords.some(kw => a.keywords.includes(kw)));
  if (state.activeSource !== 'all')
    list = list.filter(a => a.source === state.activeSource);
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    list = list.filter(a => a.title.toLowerCase().includes(q) || a.summary.toLowerCase().includes(q));
  }
  if (state.sort === 'date-desc') list.sort((a,b) => b.date.localeCompare(a.date));
  if (state.sort === 'date-asc')  list.sort((a,b) => a.date.localeCompare(b.date));
  return list;
}

// ── アクティブフィルタータグ ──
function renderActiveTags() {
  const el = document.getElementById('active-filters');
  if (!state.activeKeywords.length) { el.innerHTML = ''; return; }
  el.innerHTML = state.activeKeywords.map(kw =>
    `<div class="filter-tag">${kw}<span class="remove" data-kw="${kw}">×</span></div>`
  ).join('');
  el.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeKeywords = state.activeKeywords.filter(k => k !== btn.dataset.kw);
      state.page = 1; render();
    });
  });
}

// ── 記事リスト ──
function renderArticles() {
  const list = filteredArticles();
  const total = list.length;
  const paged = list.slice((state.page-1)*state.perPage, state.page*state.perPage);
  document.getElementById('result-count').textContent = total;

  const el = document.getElementById('article-list');
  if (!paged.length) {
    el.innerHTML = `<div class="loading-state" style="padding:60px 0">該当する情報が見つかりませんでした</div>`;
    renderPagination(0); return;
  }

  let lastDate = null, html = '';
  paged.forEach(a => {
    if (a.date !== lastDate) {
      const d = new Date(a.date);
      html += `<div class="date-group-header">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日</div>`;
      lastDate = a.date;
    }
    const badgeClass = a.source === 'news' ? 'badge-news' : 'badge-gov';
    const tags = a.keywords.map(kw => kwBadge(kw)).join('');
    html += `<div class="article-card">
      <div class="card-accent-bar"></div>
      <div class="card-body">
        <div class="card-meta">
          <span class="source-badge ${badgeClass}">${a.sourceName}</span>
          <span class="card-date">${a.date}</span>
        </div>
        <a href="${a.url}" class="card-title" target="_blank">${a.title}</a>
        <div class="card-summary">${a.summary}</div>
        <div class="card-tags">${tags}</div>
      </div>
    </div>`;
  });
  el.innerHTML = html;
  renderPagination(Math.ceil(total / state.perPage));
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = `<button class="page-btn" id="prev-btn" ${state.page===1?'disabled':''}>← 前へ</button>`;
  for (let i=1; i<=totalPages; i++)
    html += `<button class="page-btn ${i===state.page?'active':''}" data-page="${i}">${i}</button>`;
  html += `<button class="page-btn" id="next-btn" ${state.page===totalPages?'disabled':''}>次へ →</button>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => { state.page=+btn.dataset.page; render(); window.scrollTo(0,0); });
  });
  el.querySelector('#prev-btn')?.addEventListener('click', () => { if(state.page>1){state.page--;render();window.scrollTo(0,0);} });
  el.querySelector('#next-btn')?.addEventListener('click', () => { if(state.page<totalPages){state.page++;render();window.scrollTo(0,0);} });
}

function render() { renderKeywords(); renderActiveTags(); renderArticles(); }

document.getElementById('search-input').addEventListener('input', e => { state.searchQuery=e.target.value; state.page=1; render(); });
document.getElementById('sort-select').addEventListener('change', e => { state.sort=e.target.value; render(); });

bindSourceButtons();
render();

// ── 本番データ読み込み ──
fetch('./data.json')
  .then(r => r.json())
  .then(d => {
    state.articles = d.articles || [];
    // 最終更新日時をヘッダーに反映
    if (d.updatedAt) {
      document.getElementById('last-updated').textContent = d.updatedAt;
    }
    render();
  })
  .catch(() => {
    // data.json がない場合はサンプルデータのまま表示
    render();
  });
</script>
</body>
</html>
